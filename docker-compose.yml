version: "3.8"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: imgrel
      POSTGRES_PASSWORD: imgrel
      POSTGRES_DB: imagerelevance
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imgrel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
